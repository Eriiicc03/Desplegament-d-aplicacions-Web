<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Eric Barriga Medina</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/Desplegament-d-aplicacions-Web/assets/img/favicon.svg" type="image/svg+xml">

  <script>
    (function () {
      var raiz = document.documentElement;
      raiz.classList.add("con-js");
      try {
        var temaGuardado = localStorage.getItem("tema");
        if (temaGuardado === "claro" || temaGuardado === "oscuro") raiz.dataset.tema = temaGuardado;
      } catch (error) { /* el navegador no deja guardar datos: no pasa nada */ }
    })();
  </script>

  <link rel="preload" href="/Desplegament-d-aplicacions-Web/assets/fuentes/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Rutas absolutas (incluyen el nombre del repositorio): esta página
       se sirve para cualquier URL inexistente, esté en la carpeta que esté -->
  <link rel="stylesheet" href="/Desplegament-d-aplicacions-Web/css/fuentes.css">
  <link rel="stylesheet" href="/Desplegament-d-aplicacions-Web/css/variables.css">
  <link rel="stylesheet" href="/Desplegament-d-aplicacions-Web/css/base.css">
  <link rel="stylesheet" href="/Desplegament-d-aplicacions-Web/css/estructura.css">
  <link rel="stylesheet" href="/Desplegament-d-aplicacions-Web/css/componentes.css">
</head>
<body>
  <main class="portada error">
    <div class="contenedor portada__texto">
      <p class="seccion__etiqueta">Error 404</p>
      <h1 class="portada__titulo">Esta página no existe</h1>
      <p class="portada__intro">
        Puede que el enlace esté mal escrito o que la página se haya movido.
        Todo el portfolio está en la página principal.
      </p>
      <a class="boton boton--principal" href="/Desplegament-d-aplicacions-Web/">Volver al portfolio</a>
    </div>
  </main>
</body>
</html>
